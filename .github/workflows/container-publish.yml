name: Build and Publish Containers

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  metadata:
    name: Build Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate metadata
      id: version
      run: |
        version=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        echo "version=${version}" >> ${GITHUB_OUTPUT}

  build:
    name: Build ${{ matrix.image }} (${{ matrix.build-id }})
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    strategy:
      matrix:
        image: [secret-santa, zkret-santa]
        build-id: [1, 2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Docker
      uses: docker/setup-docker-action@3fb92d6d9c634363128c8cce4bc3b2826526370a # v4
      with:
        daemon-config: |
          {
            "debug": true,
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set output directory
      run: |
        echo "OUT=build-${{ matrix.image }}-${{ matrix.build-id }}" >> ${GITHUB_ENV}

    - name: Build ${{ matrix.image }} image
      run: make image-${{ matrix.image }}

    - name: Generate image digests
      run: |
        echo "Build ${{ matrix.build-id }} digests:"
        make image-digests-${{ matrix.image }}

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: build-${{ matrix.image }}-${{ matrix.build-id }}
        path: build-${{ matrix.image }}-${{ matrix.build-id }}
        retention-days: 7

  verify:
    name: Verify Reproducibility
    runs-on: ubuntu-latest
    needs: [metadata, build]
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    strategy:
      matrix:
        image: [secret-santa, zkret-santa]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: build-${{ matrix.image }}-*
        merge-multiple: false

    - name: Compare digests
      run: |
        echo "Comparing digests from both builds..."

        echo "Build 1 digests:"
        cat build-${{ matrix.image }}-1/${{ matrix.image }}.txt
        echo
        echo "Build 2 digests:"
        cat build-${{ matrix.image }}-2/${{ matrix.image }}.txt
        echo

        if cmp -s build-${{ matrix.image }}-1/${{ matrix.image }}.txt build-${{ matrix.image }}-2/${{ matrix.image }}.txt; then
          echo "✅ ${{ matrix.image }} build is reproducible!"
        else
          echo "❌ ${{ matrix.image }} build differs!"
          echo "Differences:"
          diff build-${{ matrix.image }}-1/${{ matrix.image }}.txt build-${{ matrix.image }}-2/${{ matrix.image }}.txt || true
          exit 1
        fi

  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [metadata, build, verify]
    strategy:
      matrix:
        image: [secret-santa, zkret-santa]
    env:
      REPOSITORY: ghcr.io
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download verified build
      uses: actions/download-artifact@v5
      with:
        name: build-${{ matrix.image }}-1

    - name: Setup Docker
      uses: docker/setup-docker-action@3fb92d6d9c634363128c8cce4bc3b2826526370a # v4
      with:
        daemon-config: |
          {
            "debug": true,
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Load and push
      run: |
        IMAGE_NAME="${GITHUB_REPOSITORY,,}"

        # Load the OCI image
        tar -C image-${{ matrix.image }}-1 -cf - . | docker load

        # Push the version tag
        IMAGE="${REPOSITORY}/${IMAGE_NAME}:${VERSION}"
        echo "${IMAGE}"
        docker push "${IMAGE}"

    - name: Get attestation metadata
      id: attestation_metadata
      run: |
        echo "digest=$(jq -r '.manifests[0].digest' image-zkret-santa/index.json)" >> $GITHUB_OUTPUT
        echo "provenance-subject=${REPOSITORY}/${IMAGE_NAME}" >> $GITHUB_OUTPUT

    - name: Generate ${{ matrix.image }} version attestation
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
      with:
        subject-name: ${{ steps.attestation_metadata.outputs.provenance-subject }}:${{ needs.metadata.outputs.version }}
        subject-digest: ${{ steps.attestation_metadata.outputs.digest }}
        push-to-registry: true
