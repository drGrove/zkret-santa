name: Verify Container Reproducibility

on:
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-standard:
    name: Build Standard (${{ matrix.build-id }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-id: [1, 2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Docker
      uses: docker/setup-docker-action@3fb92d6d9c634363128c8cce4bc3b2826526370a # v4
      with:
        daemon-config: |
          {
            "debug": true,
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set output directory
      run: |
        echo "OUT_DIR=build-standard-${{ matrix.build-id }}" >> ${GITHUB_ENV}

    - name: Build standard image
      run: make image-standard

    - name: Generate image digests
      run: |
        echo "Build ${{ matrix.build-id }} digests:"
        make image-digests-standard

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: build-standard-${{ matrix.build-id }}
        path: build-standard-${{ matrix.build-id }}
        retention-days: 7

  build-zksnark:
    name: Build zkSNARK (${{ matrix.build-id }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-id: [1, 2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set output directory
      run: |
        echo "OUT_DIR=build-zksnark-${{ matrix.build-id }}" >> ${GITHUB_ENV}

    - name: Build zkSNARK image
      run: make image-zksnark

    - name: Generate image digests
      run: |
        echo "Build ${{ matrix.build-id }} digests:"
        make image-digests-zksnark

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: build-zksnark-${{ matrix.build-id }}
        path: build-zksnark-${{ matrix.build-id }}
        retention-days: 7

  verify-standard:
    name: Verify Standard Reproducibility
    runs-on: ubuntu-latest
    needs: build-standard

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: build-standard-*
        merge-multiple: false

    - name: Compare digests
      run: |
        echo "Comparing digests from both builds..."

        echo "Build 1 digests:"
        cat build-standard-1/digests-standard.txt
        echo
        echo "Build 2 digests:"
        cat build-standard-2/digests-standard.txt
        echo

        if cmp -s build-standard-1/digests-standard.txt build-standard-2/digests-standard.txt; then
          echo "✅ Standard build is reproducible!"
        else
          echo "❌ Standard build differs!"
          echo "Differences:"
          diff build-standard-1/digests-standard.txt build-standard-2/digests-standard.txt || true
          exit 1
        fi

  verify-zksnark:
    name: Verify zkSNARK Reproducibility
    runs-on: ubuntu-latest
    needs: build-zksnark

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: build-zksnark-*
        merge-multiple: false

    - name: Compare digests
      run: |
        echo "Comparing digests from both builds..."

        echo "Build 1 digests:"
        cat build-zksnark-1/digests-zksnark.txt
        echo
        echo "Build 2 digests:"
        cat build-zksnark-2/digests-zksnark.txt
        echo

        if cmp -s build-zksnark-1/digests-zksnark.txt build-zksnark-2/digests-zksnark.txt; then
          echo "✅ zkSNARK build is reproducible!"
        else
          echo "❌ zkSNARK build differs!"
          echo "Differences:"
          diff build-zksnark-1/digests-zksnark.txt build-zksnark-2/digests-zksnark.txt || true
          exit 1
        fi
