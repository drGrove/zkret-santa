name: Verify Container Reproducibility

on:
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  metadata:
    name: Build Metadata
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate metadata
      id: version
      run: |
        version=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        echo "version=${version}" >> ${GITHUB_OUTPUT}

  build:
    name: Build ${{ matrix.image }} (${{ matrix.build-id }})
    runs-on: ubuntu-latest
    needs: [metadata]
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    strategy:
      matrix:
        image: [secret-santa, zkret-santa]
        build-id: [1, 2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Docker
      uses: docker/setup-docker-action@3fb92d6d9c634363128c8cce4bc3b2826526370a # v4
      with:
        daemon-config: |
          {
            "debug": true,
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set output directory
      run: |
        echo "OUT_DIR=build-${{ matrix.image }}-${{ matrix.build-id }}" >> ${GITHUB_ENV}

    - name: Build ${{ matrix.image }} image
      run: make image-${{ matrix.image }}

    - name: Generate image digests
      run: |
        echo "Build ${{ matrix.build-id }} digests:"
        make image-digests-${{ matrix.image }}

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: build-${{ matrix.image }}-${{ matrix.build-id }}
        path: build-${{ matrix.image }}-${{ matrix.build-id }}
        retention-days: 7

  verify:
    name: Verify Reproducibility
    runs-on: ubuntu-latest
    needs: build
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    strategy:
      matrix:
        image: [secret-santa, zkret-santa]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: build-${{ matrix.image }}-*
        merge-multiple: false

    - name: Compare digests
      run: |
        echo "Comparing digests from both builds..."

        echo "Build 1 digests:"
        cat build-${{ matrix.image }}-1/digests-${{ matrix.image }}.txt
        echo
        echo "Build 2 digests:"
        cat build-${{ matrix.image }}-2/digests-${{ matrix.image }}.txt
        echo

        if cmp -s build-${{ matrix.image }}-1/digests-${{ matrix.image }}.txt build-${{ matrix.image }}-2/digests-${{ matrix.imge }}.txt; then
          echo "✅ ${{ matrix.image }} build is reproducible!"
        else
          echo "❌ ${{ matrix.image }} build differs!"
          echo "Differences:"
          diff build-${{ matrix.image }}-1/digests-${{ matrix.image }}.txt build-${{ matrix.image }}-2/digests-${{ matrix.image }}.txt || true
          exit 1
        fi
